<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>심사 템플릿 구성 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="irb-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>심사 템플릿 구성</strong></h1>
					<a href="#" class="btn btn-outline-secondary" id="btnBack">
						<i class="align-middle" data-feather="arrow-left"></i> 상세로
					</a>
				</div>

				<div class="card mb-3">
					<div class="card-body py-3" id="infoBox">불러오는 중...</div>
				</div>

				<ul class="nav nav-tabs mb-3">
					<li class="nav-item"><button class="nav-link active" id="tabBasic" onclick="switchTab('BASIC')">BASIC</button></li>
					<li class="nav-item"><button class="nav-link" id="tabExtra" onclick="switchTab('EXTRA')">EXTRA</button></li>
				</ul>

				<div class="row">
					<div class="col-md-6">
						<div class="card">
							<div class="card-header"><strong>문항 은행</strong></div>
							<div class="card-body" style="max-height:520px; overflow-y:auto;" id="bankBox"></div>
						</div>
					</div>
					<div class="col-md-6">
						<div class="card">
							<div class="card-header d-flex justify-content-between align-items-center">
								<strong>선택된 템플릿 문항 (<span id="tplLabel">BASIC</span>)</strong>
								<button class="btn btn-sm btn-primary" onclick="saveTemplate()">저장</button>
							</div>
							<div class="card-body" style="max-height:520px; overflow-y:auto;" id="selectedBox"></div>
						</div>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	const params = new URLSearchParams(window.location.search);
	const testId = Number(params.get("id"));
	document.getElementById("btnBack").href = `detail.html?id=${testId}`;

	let questionBank = [];
	let currentSurveyName = "BASIC";
	let selectedTemplates = { BASIC: [], EXTRA: [] }; // { id, category, text }
	let existingTemplateIds = { BASIC: null, EXTRA: null }; // 이미 저장된 템플릿 id (수정 시 사용)

	const CATEGORY_LABEL = { DOCUMENTS: "서류심사", ETHICS: "윤리심사", SCIENTIFICS: "과학성심사", AGREEMENTS: "동의사항" };
	const STATUS_LABEL = { IN_REVIEW: "심사중", COMPLETED: "완료" };

	document.addEventListener("DOMContentLoaded", function () {
		loadInfo();
		loadQuestionBank();
	});

	function loadInfo() {
		fetch(`/api/irbs/${testId}`)
			.then(res => res.json())
			.then(item => {
				document.getElementById("infoBox").innerHTML = `
					<div class="row">
						<div class="col-md-6"><span class="text-muted small">제목</span><p class="mb-0 fw-bold">${item.title}</p></div>
						<div class="col-md-3"><span class="text-muted small">상태</span><p class="mb-0">${STATUS_LABEL[item.status] || item.status}</p></div>
						<div class="col-md-3"><span class="text-muted small">기간</span><p class="mb-0">${item.startDate || '-'} ~ ${item.endDate || '-'}</p></div>
					</div>
				`;
			});
	}

	function loadQuestionBank() {
		fetch("/api/irb-questions")
			.then(res => res.json())
			.then(list => {
				questionBank = list.filter(q => q.isActive).sort((a, b) =>
					(a.questionCategory || "").localeCompare(b.questionCategory || "") || (a.questionOrder || 0) - (b.questionOrder || 0));
				renderBank();
				loadExistingTemplates();
			});
	}

	function loadExistingTemplates() {
		fetch("/api/irb-templates")
			.then(res => res.json())
			.then(list => {
				["BASIC", "EXTRA"].forEach(name => {
					const found = list.find(t => t.irbTestId === testId && t.surveyName === name);
					if (found) {
						existingTemplateIds[name] = found.id;
						selectedTemplates[name] = found.questionList || [];
					}
				});
				renderSelected();
			});
	}

	function switchTab(name) {
		currentSurveyName = name;
		document.getElementById("tabBasic").classList.toggle("active", name === "BASIC");
		document.getElementById("tabExtra").classList.toggle("active", name === "EXTRA");
		document.getElementById("tplLabel").innerText = name;
		renderSelected();
	}

	function renderBank() {
		const box = document.getElementById("bankBox");
		box.innerHTML = questionBank.map(q => `
			<div class="d-flex justify-content-between align-items-center border-bottom py-2">
				<div>
					<span class="badge bg-light text-dark border me-1">${CATEGORY_LABEL[q.questionCategory] || q.questionCategory}</span>
					${q.questionText}
				</div>
				<button class="btn btn-sm btn-outline-primary" onclick="addToTemplate(${q.id})">추가 →</button>
			</div>
		`).join("") || '<p class="text-muted small">등록된 문항이 없습니다. 먼저 문항 관리에서 추가해주세요.</p>';
	}

	function renderSelected() {
		const box = document.getElementById("selectedBox");
		const items = selectedTemplates[currentSurveyName];
		box.innerHTML = items.length === 0
			? '<p class="text-muted small">왼쪽 문항 은행에서 담아주세요.</p>'
			: items.map((q, idx) => `
				<div class="d-flex justify-content-between align-items-center border-bottom py-2">
					<div>
						<span class="text-muted small">${idx + 1}.</span>
						<span class="badge bg-light text-dark border me-1">${CATEGORY_LABEL[q.category] || q.category}</span>
						${q.text}
					</div>
					<div class="d-flex gap-1">
						<button class="btn btn-sm btn-outline-secondary" ${idx === 0 ? 'disabled' : ''} onclick="moveItem(${idx}, -1)">↑</button>
						<button class="btn btn-sm btn-outline-secondary" ${idx === items.length - 1 ? 'disabled' : ''} onclick="moveItem(${idx}, 1)">↓</button>
						<button class="btn btn-sm btn-outline-danger" onclick="removeFromTemplate(${idx})">삭제</button>
					</div>
				</div>
			`).join("");
	}

	function addToTemplate(questionId) {
		const q = questionBank.find(i => i.id === questionId);
		selectedTemplates[currentSurveyName].push({ id: q.id, category: q.questionCategory, text: q.questionText });
		renderSelected();
	}

	function removeFromTemplate(idx) {
		selectedTemplates[currentSurveyName].splice(idx, 1);
		renderSelected();
	}

	function moveItem(idx, dir) {
		const arr = selectedTemplates[currentSurveyName];
		const target = idx + dir;
		if (target < 0 || target >= arr.length) return;
		[arr[idx], arr[target]] = [arr[target], arr[idx]];
		renderSelected();
	}

	function saveTemplate() {
		const name = currentSurveyName;
		const data = {
			irbTestId: testId,
			surveyName: name,
			questionList: selectedTemplates[name]
		};

		const id = existingTemplateIds[name];
		const url = id ? `/api/irb-templates/${id}` : "/api/irb-templates";
		const method = id ? "PUT" : "POST";

		fetch(url, {
			method: method,
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(data)
		}).then(res => res.json())
		.then(saved => {
			existingTemplateIds[name] = saved.id;
			alert(`${name} 템플릿이 저장되었습니다.`);
		}).catch(() => alert("저장 실패"));
	}
</script>
</body>
</html>
