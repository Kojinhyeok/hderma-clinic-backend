<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>모집공고 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="recruitment-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>모집공고 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddModal()">
						<i class="align-middle" data-feather="plus"></i> 공고 등록
					</button>
				</div>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="recruitmentTable">
							<thead>
							<tr>
								<th style="width:100px;">시험코드</th>
								<th>공고명</th>
								<th style="width:150px;">평가분야</th>
								<th style="width:100px;">상태</th>
								<th style="width:150px;">시험기간</th>
								<th style="width:150px;">방문횟수 / 시험부위</th>
								<th style="width:110px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<div class="modal fade" id="recruitmentModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-xl">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalTitle">공고 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="recruitmentForm">
					<input type="hidden" id="itemId">

					<div class="row">
						<div class="col-md-4 mb-3">
							<label class="form-label">시험코드</label>
							<input type="text" class="form-control" id="trialCode" placeholder="예: 피부0001">
						</div>
						<div class="col-md-4 mb-3">
							<label class="form-label">평가분야</label>
							<select class="form-select" id="evalCategory">
								<option value="EFFICACY">유효성 평가</option>
								<option value="FUNCTIONAL">기능성 평가</option>
								<option value="HEALTH_FOOD">건강기능식품 평가</option>
								<option value="SAFETY">안전성 평가</option>
							</select>
						</div>
						<div class="col-md-4 mb-3">
							<label class="form-label">상태</label>
							<select class="form-select" id="status">
								<option value="URGENT">긴급모집</option>
								<option value="OPEN">모집중</option>
								<option value="PERMANENTLY_OPEN">상시모집</option>
								<option value="CLOSED">마감</option>
							</select>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">공고명 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="trialName" required placeholder="예: 스킨케어 제품 보습 효능평가 참여자 모집">
					</div>

					<div class="row">
						<div class="col-md-3 mb-3">
							<label class="form-label">시험기간 시작</label>
							<input type="date" class="form-control" id="startDate">
						</div>
						<div class="col-md-3 mb-3">
							<label class="form-label">시험기간 종료</label>
							<input type="date" class="form-control" id="endDate">
						</div>
						<div class="col-md-3 mb-3">
							<label class="form-label">방문횟수</label>
							<input type="number" class="form-control" id="visitCount" placeholder="예: 2">
						</div>
						<div class="col-md-3 mb-3">
							<label class="form-label">시험부위</label>
							<input type="text" class="form-control" id="testSite" placeholder="예: 엉덩이">
						</div>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">모집대상</label>
							<input type="text" class="form-control" id="participationGroup" placeholder="예: 만 19~60세 여성">
						</div>
						<div class="col-md-3 mb-3">
							<label class="form-label">시험제품류</label>
							<input type="text" class="form-control" id="productType" placeholder="예: 겔">
						</div>
						<div class="col-md-3 mb-3">
							<label class="form-label">시험참여비</label>
							<input type="text" class="form-control" id="participationCost" placeholder="예: 90,000원">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">선정기준</label>
						<textarea class="form-control" id="requirements" rows="2" placeholder="예: 건성 피부, 알레르기 병력 없는 분"></textarea>
					</div>

					<div class="mb-3">
						<label class="form-label">상세 안내</label>
						<div id="editor"></div>
						<div id="editorError" class="text-danger small mt-1" style="display:none;">본문을 입력해주세요.</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave">저장하기</button>
			</div>
		</div>
	</div>
</div>

<!-- 날짜/시간대(슬롯) 관리 모달 -->
<div class="modal fade" id="slotModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">날짜/시간대 관리 — <span id="slotModalTrialName"></span></h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<p class="text-muted small mb-3">여기서 등록한 날짜·시간대만 신청자가 홈페이지에서 선택할 수 있습니다. 정원이 다 차면 자동으로 "마감"으로 표시되어 선택이 막힙니다.</p>

				<div class="row g-2 align-items-end mb-4">
					<div class="col-md-4">
						<label class="form-label">날짜</label>
						<input type="date" class="form-control" id="slotDate">
					</div>
					<div class="col-md-4">
						<label class="form-label">시간</label>
						<select class="form-select" id="slotTime">
							<option value="09:00">09:00</option>
							<option value="09:30">09:30</option>
							<option value="10:00">10:00</option>
							<option value="10:30">10:30</option>
							<option value="11:00">11:00</option>
							<option value="11:30">11:30</option>
							<option value="13:00">13:00</option>
							<option value="13:30">13:30</option>
							<option value="14:00">14:00</option>
							<option value="14:30">14:30</option>
							<option value="15:00">15:00</option>
							<option value="15:30">15:30</option>
							<option value="16:00">16:00</option>
							<option value="16:30">16:30</option>
							<option value="17:00">17:00</option>
						</select>
					</div>
					<div class="col-md-2">
						<label class="form-label">정원</label>
						<input type="number" class="form-control" id="slotCapacity" value="1" min="1">
					</div>
					<div class="col-md-2">
						<button type="button" class="btn btn-primary w-100" id="btnAddSlot">추가</button>
					</div>
				</div>

				<div class="table-responsive">
					<table class="table table-sm table-hover" id="slotTable">
						<thead>
						<tr>
							<th>날짜</th>
							<th>시간</th>
							<th>정원</th>
							<th>신청 인원</th>
							<th>상태</th>
							<th style="width:80px;"></th>
						</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/super-build/ckeditor.js"></script>
<script src="../js/ckeditor-config.js"></script>
<script src="../js/admin-utils.js"></script>
<script>
	let recruitmentList = [];
	let editorMgr = AdminUtils.createEditorManager("editor", "recruitment");

	const CATEGORY_LABEL = { EFFICACY: '유효성 평가', FUNCTIONAL: '기능성 평가', HEALTH_FOOD: '건강기능식품 평가', SAFETY: '안전성 평가' };
	const STATUS_LABEL = { URGENT: '긴급모집', OPEN: '모집중', CLOSED: '마감', PERMANENTLY_OPEN: '상시모집' };
	const STATUS_BADGE = { URGENT: 'danger', OPEN: 'success', CLOSED: 'secondary', PERMANENTLY_OPEN: 'info' };

	document.addEventListener("DOMContentLoaded", function () {
		loadList();
		editorMgr.init("");
		document.getElementById("btnSave").addEventListener("click", saveItem);
	});

	function loadList() {
		fetch("/api/recruitments")
			.then(res => res.json())
			.then(list => {
				recruitmentList = list;
				const tbody = document.querySelector("#recruitmentTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="7" class="text-center py-4">등록된 모집공고가 없습니다.</td></tr>'
					: list.map((r, index) => `
						<tr>
							<td class="align-middle">${r.trialCode || '-'}</td>
							<td class="align-middle">${r.trialName}</td>
							<td class="align-middle">${CATEGORY_LABEL[r.evalCategory] || '-'}</td>
							<td class="align-middle"><span class="badge bg-${STATUS_BADGE[r.status]}">${STATUS_LABEL[r.status]}</span></td>
							<td class="align-middle small">${r.startDate || '-'} ~ ${r.endDate || '-'}</td>
							<td class="align-middle small">${r.visitCount != null ? r.visitCount + '회' : '-'} / ${r.testSite || '-'}</td>
							<td class="align-middle">
								<button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${index})">수정</button>
								<button class="btn btn-sm btn-outline-info" onclick="openSlotModal(${index})">날짜/시간대</button>
								<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${r.id})">삭제</button>
							</td>
						</tr>
					`).join("");
			});
	}

	function collectFormData() {
		return {
			trialCode: document.getElementById("trialCode").value,
			trialName: document.getElementById("trialName").value,
			evalCategory: document.getElementById("evalCategory").value,
			status: document.getElementById("status").value,
			startDate: document.getElementById("startDate").value || null,
			endDate: document.getElementById("endDate").value || null,
			visitCount: document.getElementById("visitCount").value || null,
			testSite: document.getElementById("testSite").value,
			participationGroup: document.getElementById("participationGroup").value,
			productType: document.getElementById("productType").value,
			participationCost: document.getElementById("participationCost").value,
			requirements: document.getElementById("requirements").value,
			detailContent: editorMgr.getData()
		};
	}

	function saveItem() {
		const id = document.getElementById("itemId").value;
		const data = collectFormData();

		if (!data.trialName) { alert("공고명을 입력해주세요."); return; }

		const url = id ? `/api/recruitments/${id}` : `/api/recruitments`;
		const method = id ? "PUT" : "POST";

		fetch(url, {
			method: method,
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(data)
		}).then(res => {
			if (!res.ok) throw new Error("저장 실패");
			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('recruitmentModal')).hide();
			loadList();
		}).catch(err => alert(err.message));
	}

	function openAddModal() {
		document.getElementById("recruitmentForm").reset();
		document.getElementById("itemId").value = "";
		editorMgr.init("");
		document.getElementById("modalTitle").innerText = "공고 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('recruitmentModal')).show();
	}

	function openEditModal(index) {
		const r = recruitmentList[index];
		document.getElementById("itemId").value = r.id;
		document.getElementById("trialCode").value = r.trialCode || "";
		document.getElementById("trialName").value = r.trialName || "";
		document.getElementById("evalCategory").value = r.evalCategory || "EFFICACY";
		document.getElementById("status").value = r.status || "OPEN";
		document.getElementById("startDate").value = r.startDate || "";
		document.getElementById("endDate").value = r.endDate || "";
		document.getElementById("visitCount").value = r.visitCount || "";
		document.getElementById("testSite").value = r.testSite || "";
		document.getElementById("participationGroup").value = r.participationGroup || "";
		document.getElementById("productType").value = r.productType || "";
		document.getElementById("participationCost").value = r.participationCost || "";
		document.getElementById("requirements").value = r.requirements || "";
		editorMgr.init(r.detailContent || "");

		document.getElementById("modalTitle").innerText = "공고 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('recruitmentModal')).show();
	}

	function deleteItem(id) {
		if (confirm("이 모집공고를 삭제하시겠습니까?")) {
			fetch(`/api/recruitments/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadList(); } });
		}
	}

	// ===== 날짜/시간대(슬롯) 관리 =====
	let currentSlotRecruitmentId = null;

	function openSlotModal(index) {
		const r = recruitmentList[index];
		currentSlotRecruitmentId = r.id;
		document.getElementById("slotModalTrialName").innerText = r.trialName;
		document.getElementById("slotDate").value = "";
		loadSlots();
		bootstrap.Modal.getOrCreateInstance(document.getElementById('slotModal')).show();
	}

	function loadSlots() {
		fetch(`/api/recruitments/${currentSlotRecruitmentId}/slots/all`)
			.then(res => res.json())
			.then(list => {
				const tbody = document.querySelector("#slotTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="6" class="text-center py-4 text-muted">등록된 날짜/시간대가 없습니다.</td></tr>'
					: list.map(s => `
						<tr>
							<td class="align-middle">${s.date}</td>
							<td class="align-middle">${s.time}</td>
							<td class="align-middle">${s.capacity}</td>
							<td class="align-middle">${s.booked}</td>
							<td class="align-middle">${s.closed ? '<span class="badge bg-secondary">마감</span>' : '<span class="badge bg-success">신청가능</span>'}</td>
							<td class="align-middle"><button class="btn btn-sm btn-outline-danger" onclick="deleteSlot(${s.id})">삭제</button></td>
						</tr>
					`).join("");
			});
	}

	document.getElementById("btnAddSlot").addEventListener("click", function () {
		const date = document.getElementById("slotDate").value;
		const time = document.getElementById("slotTime").value;
		const capacity = document.getElementById("slotCapacity").value || 1;

		if (!date) { alert("날짜를 선택해주세요."); return; }

		fetch(`/api/recruitments/${currentSlotRecruitmentId}/slots`, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ date, time, capacity: Number(capacity) })
		}).then(res => {
			if (!res.ok) throw new Error("추가 실패");
			loadSlots();
		}).catch(err => alert(err.message));
	});

	function deleteSlot(slotId) {
		if (confirm("이 날짜/시간대를 삭제하시겠습니까?")) {
			fetch(`/api/recruitments/${currentSlotRecruitmentId}/slots/${slotId}`, { method: "DELETE" })
				.then(res => { if (res.ok) loadSlots(); });
		}
	}
</script>
</body>
</html>
