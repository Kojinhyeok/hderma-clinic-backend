<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>회원 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="member-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>회원 관리</strong></h1>
				</div>

				<p class="text-muted small">
					권한란에서 <b>교수</b> 또는 <b>관리자</b>로 지정하면 E-IRB 등 제한된 메뉴에 접근할 수 있게 돼요.
					가입 화면에서는 이 값을 직접 선택할 수 없고, 여기서만 승격/강등이 가능해요.
				</p>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="memberTable">
							<thead>
							<tr>
								<th style="width:70px;">번호</th>
								<th>아이디</th>
								<th>이름</th>
								<th>이메일</th>
								<th>휴대전화</th>
								<th style="width:130px;">권한</th>
								<th style="width:100px;">상태</th>
								<th style="width:130px;">가입일</th>
								<th style="width:90px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	document.addEventListener("DOMContentLoaded", loadItems);

	const STATUS_LABEL = { ACTIVE: '활동중', WITHDRAWN: '탈퇴' };
	const STATUS_BADGE = { ACTIVE: 'success', WITHDRAWN: 'secondary' };

	function loadItems() {
		fetch("/api/members")
			.then(res => res.json())
			.then(list => {
				const tbody = document.querySelector("#memberTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="9" class="text-center py-4">가입한 회원이 없습니다.</td></tr>'
					: list.map(m => `
						<tr>
							<td class="align-middle">${m.id}</td>
							<td class="align-middle">${m.username}</td>
							<td class="align-middle">${m.name}</td>
							<td class="align-middle">${m.email || '-'}</td>
							<td class="align-middle">${m.phone || '-'}</td>
							<td class="align-middle">
								<select class="form-select form-select-sm" onchange="updateRole(${m.id}, this.value)">
									<option value="MEMBER" ${m.role === 'MEMBER' ? 'selected' : ''}>일반회원</option>
									<option value="PROFESSOR" ${m.role === 'PROFESSOR' ? 'selected' : ''}>교수</option>
									<option value="ADMIN" ${m.role === 'ADMIN' ? 'selected' : ''}>관리자</option>
								</select>
							</td>
							<td class="align-middle"><span class="badge bg-${STATUS_BADGE[m.status]}">${STATUS_LABEL[m.status]}</span></td>
							<td class="align-middle">${(m.createdAt || '').substring(0, 10)}</td>
							<td class="align-middle">
								${m.status === 'ACTIVE'
									? `<button class="btn btn-sm btn-outline-danger" onclick="withdraw(${m.id})">탈퇴처리</button>`
									: '-'}
							</td>
						</tr>
					`).join("");
			});
	}

	function updateRole(id, role) {
		fetch(`/api/members/${id}/role`, {
			method: "PATCH",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ role: role })
		}).then(res => {
			if (res.ok) loadItems();
			else alert("권한 변경 실패");
		});
	}

	function withdraw(id) {
		if (confirm("이 회원을 탈퇴 처리하시겠습니까?")) {
			fetch(`/api/members/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) loadItems(); });
		}
	}
</script>
</body>
</html>
