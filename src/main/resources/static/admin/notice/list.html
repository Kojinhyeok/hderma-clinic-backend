<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>공지사항 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="notice-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>공지사항 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddModal()">
						<i class="align-middle" data-feather="plus"></i> 글 등록
					</button>
				</div>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="noticeTable">
							<thead>
							<tr>
								<th style="width:70px;">고정</th>
								<th>제목</th>
								<th style="width:90px;">조회수</th>
								<th style="width:130px;">등록일</th>
								<th style="width:130px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<div class="modal fade" id="noticeModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalTitle">글 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="noticeForm">
					<input type="hidden" id="itemId">

					<div class="form-check mb-3">
						<input class="form-check-input" type="checkbox" id="isPinned">
						<label class="form-check-label" for="isPinned">상단 고정</label>
					</div>

					<div class="mb-3">
						<label class="form-label">제목 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="title" required>
					</div>

					<div class="mb-3">
						<label class="form-label">내용</label>
						<textarea class="form-control" id="content" rows="8"></textarea>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave">저장하기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	let noticeList = [];

	document.addEventListener("DOMContentLoaded", function () {
		loadItems();
		document.getElementById("btnSave").addEventListener("click", saveItem);
	});

	function loadItems() {
		fetch("/api/notices")
			.then(res => res.json())
			.then(list => {
				noticeList = list;
				const tbody = document.querySelector("#noticeTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="5" class="text-center py-4">등록된 글이 없습니다.</td></tr>'
					: list.map((item, index) => `
						<tr>
							<td class="align-middle">${item.isPinned ? '<span class="badge bg-primary">고정</span>' : ''}</td>
							<td class="align-middle">${item.title}</td>
							<td class="align-middle">${item.viewCount ?? 0}</td>
							<td class="align-middle">${(item.createdAt || '').substring(0, 10)}</td>
							<td class="align-middle">
								<button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${index})">수정</button>
								<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">삭제</button>
							</td>
						</tr>
					`).join("");
			});
	}

	function saveItem() {
		const id = document.getElementById("itemId").value;
		const data = {
			title: document.getElementById("title").value,
			content: document.getElementById("content").value,
			isPinned: document.getElementById("isPinned").checked
		};
		if (!data.title) { alert("제목을 입력해주세요."); return; }

		const url = id ? `/api/notices/${id}` : `/api/notices`;
		const method = id ? "PUT" : "POST";

		fetch(url, {
			method: method,
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify(data)
		}).then(res => {
			if (!res.ok) throw new Error("저장 실패");
			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('noticeModal')).hide();
			loadItems();
		}).catch(err => alert(err.message));
	}

	function openAddModal() {
		document.getElementById("noticeForm").reset();
		document.getElementById("itemId").value = "";
		document.getElementById("modalTitle").innerText = "글 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('noticeModal')).show();
	}

	function openEditModal(index) {
		const item = noticeList[index];
		document.getElementById("itemId").value = item.id;
		document.getElementById("title").value = item.title;
		document.getElementById("content").value = item.content || "";
		document.getElementById("isPinned").checked = item.isPinned;

		document.getElementById("modalTitle").innerText = "글 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('noticeModal')).show();
	}

	function deleteItem(id) {
		if (confirm("이 글을 삭제하시겠습니까?")) {
			fetch(`/api/notices/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadItems(); } });
		}
	}
</script>
</body>
</html>
