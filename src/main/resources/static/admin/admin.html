<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>대시보드 - H-Derma</title>
	<link href="css/app.css" rel="stylesheet">
	<link href="css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="dashboard" data-base="">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<h1 class="h3 mb-4"><strong>대시보드</strong></h1>

				<div class="row">
					<div class="col-md-4 mb-4">
						<div class="card">
							<div class="card-body">
								<h5 class="card-title mb-1">시험의뢰 접수</h5>
								<h2 class="mb-0" id="statTrialRequest">-</h2>
								<p class="text-muted small mb-0">전체 누적 건수</p>
							</div>
						</div>
					</div>
					<div class="col-md-4 mb-4">
						<div class="card">
							<div class="card-body">
								<h5 class="card-title mb-1">모집공고</h5>
								<h2 class="mb-0" id="statRecruitment">-</h2>
								<p class="text-muted small mb-0">전체 등록 건수</p>
							</div>
						</div>
					</div>
					<div class="col-md-4 mb-4">
						<div class="card">
							<div class="card-body">
								<h5 class="card-title mb-1">가입 회원</h5>
								<h2 class="mb-0" id="statMember">-</h2>
								<p class="text-muted small mb-0">전체 가입자 수</p>
							</div>
						</div>
					</div>
				</div>

				<div class="card">
					<div class="card-body">
						<p class="mb-0 text-muted">왼쪽 사이드바에서 관리할 항목을 선택해주세요.</p>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<script src="js/app.js"></script>
<script src="js/common.js"></script>
<script>
	document.addEventListener("DOMContentLoaded", function () {
		fetch("/api/trial-requests").then(r => r.json()).then(list => {
			document.getElementById("statTrialRequest").innerText = list.length;
		}).catch(() => {});

		fetch("/api/recruitments").then(r => r.json()).then(list => {
			document.getElementById("statRecruitment").innerText = list.length;
		}).catch(() => {});

		fetch("/api/members").then(r => r.json()).then(list => {
			document.getElementById("statMember").innerText = list.length;
		}).catch(() => {});
	});
</script>
</body>
</html>
