<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>이미지 서비스 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="image-service-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>이미지 서비스 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddModal()">
						<i class="align-middle" data-feather="plus"></i> 이미지 등록
					</button>
				</div>

				<p class="text-muted small">
					사이트의 <b>이미지 서비스</b> 페이지에 노출되는 이미지/GIF를 등록합니다. 표시 순서가 작은 숫자부터 위에서 아래로 나열돼요.
					이미지 파일(JPG, PNG, GIF 등)을 올릴 수 있고, 제목과 설명은 선택 입력이에요.
				</p>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="itemTable">
							<thead>
							<tr>
								<th style="width:140px;">이미지</th>
								<th>제목</th>
								<th>설명</th>
								<th style="width:90px;">표시 순서</th>
								<th style="width:150px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="itemModalTitle">이미지 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="itemForm">
					<input type="hidden" id="itemId">
					<div class="mb-3">
						<label class="form-label">이미지 / GIF <span class="text-danger" id="fileReq">*</span></label>
						<input type="file" class="form-control" id="itemFile" accept="image/*" onchange="previewImage(this)">
						<div class="form-text" id="fileHint">수정 시 새 파일을 선택하면 기존 이미지가 교체돼요.</div>
						<img id="itemPreview" style="display:none; max-width:100%; max-height:220px; margin-top:10px; border-radius:6px;">
					</div>
					<div class="mb-3">
						<label class="form-label">제목 (선택)</label>
						<input type="text" class="form-control" id="itemTitle">
					</div>
					<div class="mb-3">
						<label class="form-label">설명 (선택)</label>
						<textarea class="form-control" id="itemDescription" rows="3"></textarea>
					</div>
					<div class="mb-3">
						<label class="form-label">표시 순서</label>
						<input type="number" class="form-control" id="itemSortOrder" value="0">
						<div class="form-text">숫자가 작을수록 위에 나와요.</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave">저장하기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	let itemList = [];

	document.addEventListener("DOMContentLoaded", function () {
		loadList();
		document.getElementById("btnSave").addEventListener("click", saveItem);
	});

	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	}

	function loadList() {
		fetch("/api/image-services")
			.then(res => res.json())
			.then(list => {
				itemList = list;
				const tbody = document.querySelector("#itemTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="5" class="text-center py-4">등록된 이미지가 없습니다.</td></tr>'
					: list.map((it, index) => `
						<tr>
							<td class="align-middle">${it.imageUrl ? `<img src="${it.imageUrl}" style="width:110px;height:70px;object-fit:cover;border-radius:6px;">` : '<span class="text-muted small">이미지 없음</span>'}</td>
							<td class="align-middle">${esc(it.title) || '-'}</td>
							<td class="align-middle small" style="white-space:pre-line;">${esc(it.description) || '-'}</td>
							<td class="align-middle">${it.sortOrder ?? 0}</td>
							<td class="align-middle">
								<button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${index})">수정</button>
								<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${it.id})">삭제</button>
							</td>
						</tr>
					`).join("");
			});
	}

	function resetPreview() {
		const img = document.getElementById("itemPreview");
		img.style.display = "none";
		img.removeAttribute("src");
	}

	function previewImage(input) {
		if (input.files && input.files[0]) {
			const reader = new FileReader();
			reader.onload = e => {
				const img = document.getElementById("itemPreview");
				img.src = e.target.result;
				img.style.display = "block";
			};
			reader.readAsDataURL(input.files[0]);
		}
	}

	function openAddModal() {
		document.getElementById("itemForm").reset();
		document.getElementById("itemId").value = "";
		document.getElementById("itemSortOrder").value = itemList.length;
		document.getElementById("itemModalTitle").innerText = "이미지 등록";
		document.getElementById("fileReq").style.display = "inline";
		resetPreview();
		bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal')).show();
	}

	function openEditModal(index) {
		const it = itemList[index];
		document.getElementById("itemForm").reset();
		document.getElementById("itemId").value = it.id;
		document.getElementById("itemTitle").value = it.title || "";
		document.getElementById("itemDescription").value = it.description || "";
		document.getElementById("itemSortOrder").value = it.sortOrder ?? 0;
		document.getElementById("itemModalTitle").innerText = "이미지 수정";
		document.getElementById("fileReq").style.display = "none";
		resetPreview();
		if (it.imageUrl) {
			const img = document.getElementById("itemPreview");
			img.src = it.imageUrl;
			img.style.display = "block";
		}
		bootstrap.Modal.getOrCreateInstance(document.getElementById('itemModal')).show();
	}

	async function saveItem() {
		const id = document.getElementById("itemId").value;
		const file = document.getElementById("itemFile").files[0];

		if (!id && !file) { alert("이미지 또는 GIF 파일을 선택해주세요."); return; }
		if (file && !file.type.startsWith("image/")) { alert("이미지 또는 GIF 파일만 업로드할 수 있습니다."); return; }

		const data = {
			title: document.getElementById("itemTitle").value.trim(),
			description: document.getElementById("itemDescription").value.trim(),
			sortOrder: parseInt(document.getElementById("itemSortOrder").value, 10) || 0
		};
		if (file) {
			data.originalFilename = file.name;
			data.mimeType = file.type;
			data.fileSize = file.size;
		}

		const btn = document.getElementById("btnSave");
		btn.disabled = true;
		btn.innerText = "저장 중...";

		try {
			const response = await fetch(id ? `/api/image-services/${id}` : "/api/image-services", {
				method: id ? "PUT" : "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data)
			});
			if (!response.ok) {
				const err = await response.json().catch(() => ({}));
				throw new Error(err.message || "저장 실패");
			}
			const result = await response.json();

			if (result.uploadUrl && file) {
				const up = await fetch(result.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": file.type } });
				if (!up.ok) throw new Error("이미지 파일 업로드에 실패했습니다. (저장소 응답 " + up.status + ") 잠시 후 다시 시도해주세요.");
			}

			bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
			loadList();
		} catch (err) {
			alert(err.message);
		} finally {
			btn.disabled = false;
			btn.innerText = "저장하기";
		}
	}

	function deleteItem(id) {
		if (confirm("이 이미지를 삭제하시겠습니까?")) {
			fetch(`/api/image-services/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) loadList(); else alert("삭제 실패"); });
		}
	}
</script>
</body>
</html>
