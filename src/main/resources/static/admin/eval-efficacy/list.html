<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>화장품 효능평가 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="eval-efficacy-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>화장품 효능평가 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddGroupModal()">
						<i class="align-middle" data-feather="plus"></i> 제품군 추가
					</button>
				</div>

				<p class="text-muted small">제품군(예: 스킨케어제품)을 먼저 등록한 뒤, "세부항목 관리"에서 그 안의 측정 항목(주름, 보습 등)을 추가하세요.</p>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="groupTable">
							<thead>
							<tr>
								<th>제품군명</th>
								<th style="width:120px;">세부항목 수</th>
								<th style="width:220px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<!-- 제품군 등록/수정 모달 -->
<div class="modal fade" id="groupModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="groupModalTitle">제품군 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="groupForm">
					<input type="hidden" id="groupId" name="id">
					<div class="mb-3">
						<label class="form-label">제품군명 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="groupName" name="name" required placeholder="예: 스킨케어제품">
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSaveGroup">저장하기</button>
			</div>
		</div>
	</div>
</div>

<!-- 세부항목 관리 모달 -->
<div class="modal fade" id="itemsModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">세부항목 관리 — <span id="itemsModalGroupName"></span></h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<div class="input-group mb-3">
					<input type="text" class="form-control" id="newItemName" placeholder="예: 주름">
					<button class="btn btn-primary" id="btnAddItem">추가</button>
				</div>
				<ul class="list-group" id="itemsList"></ul>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	let groupList = [];
	let currentGroupId = null;
	let currentGroupItems = [];

	document.addEventListener("DOMContentLoaded", function () {
		loadGroups();
		document.getElementById("btnSaveGroup").addEventListener("click", saveGroup);
		document.getElementById("btnAddItem").addEventListener("click", addItem);
	});

	// ===== 제품군 =====
	function loadGroups() {
		fetch("/api/eval-efficacy-groups")
			.then(res => res.json())
			.then(list => {
				groupList = list;
				const tbody = document.querySelector("#groupTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="3" class="text-center py-4">데이터가 없습니다.</td></tr>'
					: list.map((g, index) => `
						<tr>
							<td class="align-middle">${g.name}</td>
							<td class="align-middle">${g.itemCount ?? 0}개</td>
							<td class="align-middle">
								<button class="btn btn-sm btn-outline-secondary" onclick="openItemsModal(${index})">세부항목 관리</button>
								<button class="btn btn-sm btn-outline-primary" onclick="openEditGroupModal(${index})">수정</button>
								<button class="btn btn-sm btn-outline-danger" onclick="deleteGroup(${g.id})">삭제</button>
							</td>
						</tr>
					`).join("");
			});
	}

	function openAddGroupModal() {
		document.getElementById("groupForm").reset();
		document.getElementById("groupId").value = "";
		document.getElementById("groupModalTitle").innerText = "제품군 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('groupModal')).show();
	}

	function openEditGroupModal(index) {
		const g = groupList[index];
		document.getElementById("groupId").value = g.id;
		document.getElementById("groupName").value = g.name;
		document.getElementById("groupModalTitle").innerText = "제품군 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('groupModal')).show();
	}

	function saveGroup() {
		const id = document.getElementById("groupId").value;
		const name = document.getElementById("groupName").value.trim();
		if (!name) { alert("제품군명을 입력해주세요."); return; }

		const url = id ? `/api/eval-efficacy-groups/${id}` : `/api/eval-efficacy-groups`;
		const method = id ? "PUT" : "POST";

		fetch(url, {
			method: method,
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ name: name })
		}).then(res => {
			if (!res.ok) throw new Error("저장 실패");
			bootstrap.Modal.getInstance(document.getElementById('groupModal')).hide();
			loadGroups();
		}).catch(err => alert(err.message));
	}

	function deleteGroup(id) {
		if (confirm("이 제품군과 그 안의 모든 세부항목이 삭제됩니다. 계속할까요?")) {
			fetch(`/api/eval-efficacy-groups/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadGroups(); } });
		}
	}

	// ===== 세부항목 =====
	function openItemsModal(index) {
		const g = groupList[index];
		currentGroupId = g.id;
		document.getElementById("itemsModalGroupName").innerText = g.name;
		loadItems(g.id);
		bootstrap.Modal.getOrCreateInstance(document.getElementById('itemsModal')).show();
	}

	function loadItems(groupId) {
		fetch(`/api/eval-efficacy-groups/${groupId}/items`)
			.then(res => res.json())
			.then(items => {
				currentGroupItems = items;
				const ul = document.getElementById("itemsList");
				ul.innerHTML = items.length === 0
					? '<li class="list-group-item text-muted text-center">등록된 항목이 없습니다.</li>'
					: items.map(item => `
						<li class="list-group-item d-flex justify-content-between align-items-center">
							${item.name}
							<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">삭제</button>
						</li>
					`).join("");
			});
	}

	function addItem() {
		const input = document.getElementById("newItemName");
		const name = input.value.trim();
		if (!name) return;

		fetch(`/api/eval-efficacy-groups/${currentGroupId}/items`, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ name: name })
		}).then(res => {
			if (!res.ok) throw new Error("추가 실패");
			input.value = "";
			loadItems(currentGroupId);
			loadGroups(); // 개수 갱신
		}).catch(err => alert(err.message));
	}

	function deleteItem(itemId) {
		fetch(`/api/eval-efficacy-items/${itemId}`, { method: "DELETE" })
			.then(res => {
				if (res.ok) {
					loadItems(currentGroupId);
					loadGroups();
				}
			});
	}
</script>
</body>
</html>
