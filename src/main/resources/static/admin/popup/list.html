<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>팝업 관리 - H-Derma</title>
	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="popup-list" data-base="../">
<div class="wrapper">
	<div id="sidebar-container"></div>
	<div class="main">
		<div id="header-container"></div>

		<main class="content">
			<div class="container-fluid p-0">
				<div class="d-flex justify-content-between align-items-center mb-3">
					<h1 class="h3 mb-0"><strong>팝업 관리</strong></h1>
					<button class="btn btn-primary" onclick="openAddModal()">
						<i class="align-middle" data-feather="plus"></i> 팝업 등록
					</button>
				</div>

				<div class="card">
					<div class="table-responsive">
						<table class="table table-hover my-0" id="popupTable">
							<thead>
							<tr>
								<th style="width:80px;">미리보기</th>
								<th>제목</th>
								<th style="width:180px;">노출기간</th>
								<th style="width:80px;">노출여부</th>
								<th style="width:130px;">관리</th>
							</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>
	</div>
</div>

<div class="modal fade" id="popupModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered modal-lg">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="modalTitle">팝업 등록</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="popupForm">
					<input type="hidden" id="itemId">

					<div class="mb-3">
						<label class="form-label">팝업 이미지</label>
						<input type="file" class="form-control" id="popupFile" accept="image/*" onchange="previewImage(this)">
						<div id="thumbnailPreview" class="mt-2 d-none">
							<img id="previewImg" src="" style="max-width:200px; height:auto;" class="img-thumbnail border">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">관리자 식별용 제목 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="title" required placeholder="예: 2026년 3월 이벤트 팝업">
					</div>

					<div class="mb-3">
						<label class="form-label">클릭 시 이동할 링크</label>
						<input type="text" class="form-control" id="linkUrl" placeholder="예: /about/newsletter (없으면 비워두세요)">
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">노출 시작일시</label>
							<input type="datetime-local" class="form-control" id="startDate">
						</div>
						<div class="col-md-6 mb-3">
							<label class="form-label">노출 종료일시</label>
							<input type="datetime-local" class="form-control" id="endDate">
						</div>
					</div>

					<div class="row">
						<div class="col-md-4 mb-3">
							<label class="form-label">가로 크기(px)</label>
							<input type="number" class="form-control" id="width" value="400">
						</div>
						<div class="col-md-4 mb-3">
							<label class="form-label">노출 순서</label>
							<input type="number" class="form-control" id="popupOrder" value="0">
						</div>
						<div class="col-md-4 mb-3">
							<label class="form-label d-block">노출 여부</label>
							<div class="form-check form-switch mt-2">
								<input class="form-check-input" type="checkbox" id="isActive" checked>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
				<button type="button" class="btn btn-primary" id="btnSave">저장하기</button>
			</div>
		</div>
	</div>
</div>

<script src="../js/app.js"></script>
<script src="../js/common.js"></script>
<script>
	let popupList = [];

	document.addEventListener("DOMContentLoaded", function () {
		loadItems();
		document.getElementById("btnSave").addEventListener("click", saveItem);
	});

	function loadItems() {
		fetch("/api/popups")
			.then(res => res.json())
			.then(list => {
				popupList = list;
				const tbody = document.querySelector("#popupTable tbody");
				tbody.innerHTML = list.length === 0
					? '<tr><td colspan="5" class="text-center py-4">등록된 팝업이 없습니다.</td></tr>'
					: list.map((item, index) => `
						<tr>
							<td>
								${item.imageUrl
									? `<img src="${item.imageUrl}" style="width:50px; height:50px; object-fit:cover;" class="rounded border">`
									: `<div class="bg-light text-center rounded border" style="width:50px; height:50px; line-height:50px; font-size:10px;">No Image</div>`}
							</td>
							<td class="align-middle">${item.title}</td>
							<td class="align-middle small">${(item.startDate || '-').toString().replace('T',' ').substring(0,16)} ~ ${(item.endDate || '-').toString().replace('T',' ').substring(0,16)}</td>
							<td class="align-middle">${item.isActive ? '<span class="badge bg-success">ON</span>' : '<span class="badge bg-secondary">OFF</span>'}</td>
							<td class="align-middle">
								<button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${index})">수정</button>
								<button class="btn btn-sm btn-outline-danger" onclick="deleteItem(${item.id})">삭제</button>
							</td>
						</tr>
					`).join("");
			});
	}

	async function saveItem() {
		const btn = document.getElementById("btnSave");
		const id = document.getElementById("itemId").value;
		const fileInput = document.getElementById("popupFile");
		const file = fileInput.files[0];

		const data = {
			title: document.getElementById("title").value,
			linkUrl: document.getElementById("linkUrl").value || null,
			startDate: document.getElementById("startDate").value || null,
			endDate: document.getElementById("endDate").value || null,
			width: parseInt(document.getElementById("width").value) || 400,
			popupOrder: parseInt(document.getElementById("popupOrder").value) || 0,
			isActive: document.getElementById("isActive").checked
		};
		if (!data.title) { alert("제목을 입력해주세요."); return; }
		if (file) {
			data.originalFilename = file.name;
			data.mimeType = file.type;
			data.fileSize = file.size;
		}

		const url = id ? `/api/popups/${id}` : `/api/popups`;
		const method = id ? "PUT" : "POST";

		try {
			btn.disabled = true;
			btn.innerText = "처리 중...";
			const response = await fetch(url, {
				method: method,
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(data)
			});
			if (!response.ok) throw new Error("저장 실패");
			const result = await response.json();

			if (result.uploadUrl && file) {
				await fetch(result.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": file.type } });
			}
			alert("처리되었습니다.");
			bootstrap.Modal.getInstance(document.getElementById('popupModal')).hide();
			loadItems();
		} catch (err) {
			alert(err.message);
		} finally {
			btn.disabled = false;
			btn.innerText = "저장하기";
		}
	}

	function previewImage(input) {
		const previewImg = document.getElementById("previewImg");
		if (input.files && input.files[0]) {
			const reader = new FileReader();
			reader.onload = e => {
				previewImg.src = e.target.result;
				document.getElementById("thumbnailPreview").classList.remove("d-none");
			}
			reader.readAsDataURL(input.files[0]);
		}
	}

	function openAddModal() {
		document.getElementById("popupForm").reset();
		document.getElementById("itemId").value = "";
		document.getElementById("thumbnailPreview").classList.add("d-none");
		document.getElementById("width").value = 400;
		document.getElementById("popupOrder").value = 0;
		document.getElementById("isActive").checked = true;
		document.getElementById("modalTitle").innerText = "팝업 등록";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('popupModal')).show();
	}

	function openEditModal(index) {
		const item = popupList[index];
		document.getElementById("itemId").value = item.id;
		document.getElementById("title").value = item.title;
		document.getElementById("linkUrl").value = item.linkUrl || "";
		document.getElementById("startDate").value = item.startDate ? item.startDate.substring(0,16) : "";
		document.getElementById("endDate").value = item.endDate ? item.endDate.substring(0,16) : "";
		document.getElementById("width").value = item.width || 400;
		document.getElementById("popupOrder").value = item.popupOrder || 0;
		document.getElementById("isActive").checked = item.isActive;

		const previewImg = document.getElementById("previewImg");
		if (item.imageUrl) {
			previewImg.src = item.imageUrl;
			document.getElementById("thumbnailPreview").classList.remove("d-none");
		} else {
			document.getElementById("thumbnailPreview").classList.add("d-none");
		}

		document.getElementById("modalTitle").innerText = "팝업 수정";
		bootstrap.Modal.getOrCreateInstance(document.getElementById('popupModal')).show();
	}

	function deleteItem(id) {
		if (confirm("이 팝업을 삭제하시겠습니까?")) {
			fetch(`/api/popups/${id}`, { method: "DELETE" })
				.then(res => { if (res.ok) { alert("삭제되었습니다."); loadItems(); } });
		}
	}
</script>
</body>
</html>
