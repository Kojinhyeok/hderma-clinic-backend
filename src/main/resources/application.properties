spring.application.name=hderma-clinic-backend
server.port=8080

# ---- DB: 아직 실제 서버 없이 우선 H2(메모리 DB)로 임시 기동 ----
# 디자인 확정 후 MariaDB 실제 연결정보로 교체 예정
spring.datasource.url=jdbc:h2:mem:hdermadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# ---- AWS: 실제 키 아직 없음, 로컬 기동만 되게 하는 더미값 ----
# 실제 S3/SES 쓸 때 진짜 access key/secret key로 교체 예정
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=dummy
spring.cloud.aws.credentials.secret-key=dummy
# 임시용(캐시 삭제버전)
spring.thymeleaf.cache=false