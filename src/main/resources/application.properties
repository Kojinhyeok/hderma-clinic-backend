spring.application.name=hderma-clinic-backend
server.port=8080

# ---- DB: 실제 RDS(MariaDB) 연결 ----
spring.datasource.url=jdbc:mariadb://hderma-clinic-db.cfe46ucsu7eo.ap-northeast-2.rds.amazonaws.com:3306/hderma_clinic?sslMode=trust
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# ---- AWS S3 ----
spring.cloud.aws.region.static=ap-northeast-2
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
spring.cloud.aws.s3.bucket=hderma-clinic-files

spring.thymeleaf.cache=false
app.upload.dir=uploads
