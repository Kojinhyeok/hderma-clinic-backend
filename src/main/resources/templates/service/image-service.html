<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 서비스 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
<style>
.imgsvc-wrap{max-width:1100px; margin:0 auto; padding:0 40px;}
.imgsvc-item{margin:0 0 56px; text-align:center;}
.imgsvc-item img{max-width:100%; height:auto; display:block; margin:0 auto; border-radius:12px;}
.imgsvc-item h3{margin:20px 0 8px; font-size:20px; font-weight:800; color:var(--navy);}
.imgsvc-item p{margin:0; font-size:14.5px; line-height:1.7; color:var(--gray); white-space:pre-line;}
@media(max-width:700px){ .imgsvc-wrap{padding:0 20px;} .imgsvc-item{margin-bottom:40px;} }
</style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>이미지 서비스</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/service/clinical-evaluation}">임상평가</a>
    <a th:href="@{/service/image-service}" class="active">이미지 서비스</a>
    <a th:href="@{/service/certification-mark}">인증마크</a>
  </nav>
</div>

<section class="sub-content">
  <!-- 관리자에서 등록한 이미지/GIF -->
  <div class="imgsvc-wrap" id="imgSvcList" style="display:none;"></div>

  <!-- 등록된 이미지가 없을 때 -->
  <div class="coming-soon reveal-up" id="imgSvcEmpty" style="display:none;">
    <div class="coming-soon-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
    </div>
    <h2>이미지 서비스 페이지 준비 중입니다</h2>
    <p>보다 나은 서비스로 곧 찾아뵙겠습니다.<br>서비스 오픈 전까지 조금만 기다려 주세요.</p>
    <a th:href="@{/}" class="btn-line"><span>홈으로 가기</span><span class="circ">→</span></a>
  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script>
document.addEventListener("DOMContentLoaded", function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  fetch("/api/image-services")
    .then(function (res) { return res.ok ? res.json() : []; })
    .then(function (list) {
      list = list.filter(function (it) { return it.imageUrl; });
      if (list.length === 0) {
        document.getElementById("imgSvcEmpty").style.display = "block";
        return;
      }
      var box = document.getElementById("imgSvcList");
      box.innerHTML = list.map(function (it) {
        return '<figure class="imgsvc-item">' +
          '<img src="' + it.imageUrl + '" alt="' + esc(it.title) + '" loading="lazy">' +
          (it.title ? '<h3>' + esc(it.title) + '</h3>' : '') +
          (it.description ? '<p>' + esc(it.description) + '</p>' : '') +
          '</figure>';
      }).join("");
      box.style.display = "block";
    })
    .catch(function () {
      document.getElementById("imgSvcEmpty").style.display = "block";
    });
});
</script>

</body>
</html>
