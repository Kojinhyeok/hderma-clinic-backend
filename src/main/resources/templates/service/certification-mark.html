<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인증마크 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>인증마크</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/service/clinical-evaluation}">임상평가</a>
    <a th:href="@{/service/image-service}">이미지 서비스</a>
    <a th:href="@{/service/certification-mark}" class="active">인증마크</a>
  </nav>
</div>

<section class="sub-content">
  <div class="cert-wrap" id="certWrap"></div>
  <div class="cert-empty" id="certEmpty" style="display:none;">등록된 인증마크가 없습니다.</div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script>
document.addEventListener("DOMContentLoaded", function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function bySort(a, b) { return (a.sortOrder || 0) - (b.sortOrder || 0); }

  // 관리자 > 인증마크 관리에서 등록한 대분류 + 세부 마크 이미지를 그대로 표시
  fetch("/api/certification-marks")
    .then(function (res) { return res.ok ? res.json() : []; })
    .then(function (marks) {
      marks.sort(bySort);
      if (marks.length === 0) {
        document.getElementById("certEmpty").style.display = "block";
        return;
      }
      return Promise.all(marks.map(function (m) {
        return fetch("/api/certification-marks/" + m.id + "/categories")
          .then(function (res) { return res.ok ? res.json() : []; })
          .then(function (cats) { return { mark: m, cats: cats.sort(bySort) }; });
      })).then(function (groups) {
        document.getElementById("certWrap").innerHTML = groups.map(function (g) {
          var cards = g.cats.map(function (c) {
            var mark = c.imageUrl
              ? '<img src="' + c.imageUrl + '" alt="' + esc(c.title) + '">'
              : 'No Image';
            return '<div class="cert-card"><span class="mark">' + mark + '</span><span>' + esc(c.title) + '</span></div>';
          }).join("");
          return '<div class="cert-group">' +
            '<h3><span class="dot"></span>' + esc(g.mark.title) + '</h3>' +
            '<div class="cert-grid">' + (cards || '<p class="cert-empty" style="grid-column:1/-1;">준비 중입니다.</p>') + '</div>' +
            '</div>';
        }).join("");
      });
    })
    .catch(function () {
      document.getElementById("certEmpty").style.display = "block";
    });
});
</script>

</body>
</html>
