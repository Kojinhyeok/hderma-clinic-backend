<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험절차 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>시험절차</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/inquiry/request}">시험의뢰</a>
    <a th:href="@{/inquiry/process}" class="active">시험절차</a>
  </nav>
</div>

<section class="sub-content">
  <div class="tp-section">
    <div class="tp-box reveal-stagger">

      <div class="tp-item">
        <span class="tp-step">STEP 1</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <p class="tp-title">시험문의</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 2</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15Z"/></svg></span>
        <p class="tp-title">시험계획 상담</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 3</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z"/></svg></span>
        <p class="tp-title">시험계약</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 4</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2 3 6v6c0 5 4 8.5 9 10 5-1.5 9-5 9-10V6l-9-4Z"/><path d="m9 12 2 2 4-4"/></svg></span>
        <p class="tp-title">IRB 심의</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 5</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 8.5c1.4 0 2.5 1.1 2.5 2.5S18.4 13.5 17 13.5M20 20a5 5 0 0 0-4-4.9"/></svg></span>
        <p class="tp-title">시험대상자 모집</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 6</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 2v6L4 20a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2M9 2h6M8 15h8"/></svg></span>
        <p class="tp-title">시험진행</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 7</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V4M16 20v-8M22 20v-5"/></svg></span>
        <p class="tp-title">결과분석</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 8</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg></span>
        <p class="tp-title">결과보고서 작성</p>
        <span class="tp-arrow">›</span>
      </div>

      <div class="tp-item">
        <span class="tp-step">STEP 9</span>
        <span class="tp-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>
        <p class="tp-title">시험 종료</p>
      </div>

      <a th:href="@{/inquiry/request}" class="tp-item tp-cta">
        <p class="tp-title">시험의뢰신청<br>바로가기</p>
        <span class="arrow-ic">→</span>
      </a>

    </div>
  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
