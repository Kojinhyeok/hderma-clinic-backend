<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스레터 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>뉴스레터</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/about/newsletter}" class="active">뉴스레터</a>
    <a th:href="@{/about/notice}">공지사항</a>
  </nav>
</div>

<section class="sub-content">
  <div class="nl-wrap">
    <div class="nl-grid reveal-stagger" id="nlGrid"></div>

    <div class="nl-empty" id="nlEmpty" style="display:none;">
      <p>등록된 뉴스레터가 없습니다.</p>
    </div>
  </div>
</section>

<!-- 뉴스레터 상세 모달 -->
<div id="nlModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:3000; align-items:center; justify-content:center;">
  <div style="background:#fff; max-width:680px; width:92%; max-height:85vh; overflow-y:auto; border-radius:10px; padding:32px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
      <h3 id="nlModalTitle" style="margin:0;"></h3>
      <button type="button" id="nlModalClose" style="border:none; background:none; font-size:1.4rem; cursor:pointer;">&times;</button>
    </div>
    <p style="color:#888; font-size:0.85rem; margin-bottom:20px;" id="nlModalDate"></p>
    <img id="nlModalImage" style="width:100%; border-radius:6px; margin-bottom:20px; display:none;">
    <div id="nlModalContent" style="white-space:pre-line; line-height:1.7;"></div>
  </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
  fetch("/api/newsletters")
    .then(function (res) { return res.json(); })
    .then(function (list) {
      var grid = document.getElementById("nlGrid");
      if (list.length === 0) {
        document.getElementById("nlEmpty").style.display = "block";
        return;
      }
      var sorted = list.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });

      grid.innerHTML = sorted.map(function (n) {
        var date = (n.createdAt || "").substring(0, 10).replace(/-/g, ".");
        var thumb = n.thumbnailUrl
          ? '<img src="' + n.thumbnailUrl + '" alt="' + n.title + '">'
          : '<div class="no-img">이미지 준비중</div>';
        return (
          '<a href="javascript:" class="nl-card" onclick="openNewsletter(' + n.id + ')">' +
          '<div class="thumb">' + thumb + '</div>' +
          '<div class="cap"><h4>' + n.title + '</h4><span class="date">' + date + '</span></div>' +
          '</a>'
        );
      }).join("");
    });

  document.getElementById("nlModalClose").addEventListener("click", function () {
    document.getElementById("nlModal").style.display = "none";
  });
});

function openNewsletter(id) {
  fetch("/api/newsletters/" + id)
    .then(function (res) { return res.json(); })
    .then(function (n) {
      document.getElementById("nlModalTitle").innerText = n.title;
      document.getElementById("nlModalDate").innerText = (n.createdAt || "").substring(0, 10).replace(/-/g, ".");
      var img = document.getElementById("nlModalImage");
      if (n.thumbnailUrl) { img.src = n.thumbnailUrl; img.style.display = "block"; }
      else { img.style.display = "none"; }
      document.getElementById("nlModalContent").innerText = n.content || "";
      document.getElementById("nlModal").style.display = "flex";
    });
}
</script>

</body>
</html>
