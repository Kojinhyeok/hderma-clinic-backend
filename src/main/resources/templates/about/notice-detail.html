<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
<style>
  .notice-detail-wrap{ max-width:820px; margin:0 auto; padding:0 20px; }
  .notice-detail-head{ border-bottom:2px solid var(--ink); padding-bottom:20px; margin-bottom:28px; }
  .notice-detail-head h1{ font-size:1.6rem; margin:0 0 10px; }
  .notice-detail-meta{ color:var(--gray); font-size:0.88rem; }
  .notice-detail-content{ line-height:1.8; min-height:200px; }
  .notice-detail-content img{ max-width:100%; height:auto; }
  .notice-detail-back{ margin-top:36px; }
</style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>공지사항</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<section class="sub-content">
  <div class="notice-detail-wrap">
    <div id="loadingBox"><p class="sub-desc">불러오는 중입니다...</p></div>

    <div id="contentBox" style="display:none;">
      <div class="notice-detail-head">
        <h1 id="detailTitle"></h1>
        <p class="notice-detail-meta" id="detailMeta"></p>
      </div>
      <div class="notice-detail-content" id="detailContent"></div>
    </div>

    <a href="/about/notice" class="btn-line notice-detail-back"><span>목록으로</span><span class="circ">→</span></a>
  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
  var id = window.location.pathname.split("/").pop();

  fetch("/api/notices/" + id)
    .then(function (res) {
      if (!res.ok) throw new Error("공지사항을 찾을 수 없습니다.");
      return res.json();
    })
    .then(function (n) {
      document.getElementById("detailTitle").innerText = n.title;
      var date = (n.createdAt || "").substring(0, 10).replace(/-/g, ".");
      document.getElementById("detailMeta").innerText = date + " · 조회 " + (n.viewCount || 0);
      document.getElementById("detailContent").innerHTML = n.content || "";
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
    })
    .catch(function () {
      document.getElementById("loadingBox").innerHTML = '<p class="sub-desc">해당 공지사항을 찾을 수 없습니다.</p>';
    });
});
</script>

</body>
</html>
