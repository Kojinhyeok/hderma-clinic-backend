<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공지사항 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>공지사항</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/about/newsletter}">뉴스레터</a>
    <a th:href="@{/about/notice}" class="active">공지사항</a>
  </nav>
</div>

<section class="sub-content">
  <div class="notice-wrap reveal-up">
    <table class="notice-table">
      <thead>
        <tr>
          <th class="center" style="width:8%;">번호</th>
          <th style="width:52%;">제목</th>
          <th class="center" style="width:13%;">글쓴이</th>
          <th class="center" style="width:14%;">등록일</th>
          <th class="center" style="width:13%;">조회수</th>
        </tr>
      </thead>
      <tbody id="noticeBody"></tbody>
    </table>

    <div class="notice-empty" id="noticeEmpty" style="display:none;">
      <p>등록된 공지사항이 없습니다.</p>
    </div>
  </div>
</section>

<!-- 공지 상세 모달 -->
<div id="noticeModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:3000; align-items:center; justify-content:center;">
  <div style="background:#fff; max-width:640px; width:92%; max-height:80vh; overflow-y:auto; border-radius:10px; padding:32px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
      <h3 id="noticeModalTitle" style="margin:0;"></h3>
      <button type="button" id="noticeModalClose" style="border:none; background:none; font-size:1.4rem; cursor:pointer;">&times;</button>
    </div>
    <p style="color:#888; font-size:0.85rem; margin-bottom:20px;" id="noticeModalDate"></p>
    <div id="noticeModalContent" style="white-space:pre-line; line-height:1.7;"></div>
  </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
  fetch("/api/notices")
    .then(function (res) { return res.json(); })
    .then(function (list) {
      var tbody = document.getElementById("noticeBody");
      if (list.length === 0) {
        document.getElementById("noticeEmpty").style.display = "block";
        return;
      }
      var sorted = list.slice().sort(function (a, b) {
        if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
        return new Date(b.createdAt) - new Date(a.createdAt);
      });

      var normalCount = sorted.filter(function (n) { return !n.isPinned; }).length;
      var idx = normalCount;

      tbody.innerHTML = sorted.map(function (n) {
        var num = n.isPinned ? "공지" : idx--;
        var date = (n.createdAt || "").substring(0, 10).replace(/-/g, ".");
        return (
          '<tr>' +
          '<td class="center num">' + num + '</td>' +
          '<td><a href="javascript:" onclick="openNotice(' + n.id + ')">' +
          (n.isPinned ? '<span class="pin-badge">공지</span>' : '') +
          '<span class="ttl">' + n.title + '</span></a></td>' +
          '<td class="center writer">관리자</td>' +
          '<td class="center date">' + date + '</td>' +
          '<td class="center views">' + (n.viewCount || 0) + '</td>' +
          '</tr>'
        );
      }).join("");
    });

  document.getElementById("noticeModalClose").addEventListener("click", function () {
    document.getElementById("noticeModal").style.display = "none";
  });
});

function openNotice(id) {
  fetch("/api/notices/" + id)
    .then(function (res) { return res.json(); })
    .then(function (n) {
      document.getElementById("noticeModalTitle").innerText = n.title;
      document.getElementById("noticeModalDate").innerText =
        (n.createdAt || "").substring(0, 10).replace(/-/g, ".") + " · 조회 " + (n.viewCount || 0);
      document.getElementById("noticeModalContent").innerText = n.content || "";
      document.getElementById("noticeModal").style.display = "flex";
    });
}
</script>

</body>
</html>
