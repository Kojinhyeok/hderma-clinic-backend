<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-IRB 심사 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
<style>
  .irb-wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
  .irb-info-card { background:#f8f9fb; border:1px solid #e5e8ee; border-radius:12px; padding:24px 28px; margin-bottom:28px; }
  .irb-info-card h2 { margin:0 0 8px; font-size:1.35rem; }
  .irb-info-card .meta { color:#6b7280; font-size:0.92rem; }
  .irb-section { margin-bottom: 32px; }
  .irb-section-header { font-weight:700; padding:12px 16px; background:#eef1f6; border-radius:8px 8px 0 0; }
  .irb-q-row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:14px 16px; border:1px solid #e5e8ee; border-top:none; }
  .irb-q-text { flex:1; font-size:0.95rem; }
  .irb-q-answer { flex-shrink:0; display:flex; gap:14px; white-space:nowrap; }
  .irb-q-answer label { margin-right:6px; font-size:0.9rem; cursor:pointer; }
  .irb-q-answer textarea { width:280px; min-height:60px; }
  .irb-result-box { border:1px solid #e5e8ee; border-radius:8px; padding:20px; margin-bottom:24px; }
  .irb-result-box .radios { display:flex; gap:20px; margin-bottom:14px; }
  .irb-result-box textarea { width:100%; min-height:100px; }
  .irb-submit-bar { text-align:center; margin-top:24px; }
</style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>E-IRB 심사</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<section class="sub-content">
  <div class="irb-wrap">

    <div id="loadingBox"><p class="sub-desc">불러오는 중입니다...</p></div>

    <div id="errorBox" style="display:none;">
      <div class="irb-info-card">
        <p id="errorMessage"></p>
      </div>
    </div>

    <div id="contentBox" style="display:none;">
      <div class="irb-info-card">
        <h2 id="infoTitle"></h2>
        <p class="meta">
          IRB 코드: <span id="infoCode">-</span> ·
          심사기간: <span id="infoPeriod">-</span> ·
          상태: <span id="infoStatus">-</span>
        </p>
        <p class="meta" id="infoFiles"></p>
      </div>

      <form id="surveyForm">
        <div id="questionArea"></div>

        <div class="irb-result-box">
          <h3 style="margin-top:0;">종합 심사 결과</h3>
          <div class="radios">
            <label><input type="radio" name="reviewResult" value="APPROVED"> 승인</label>
            <label><input type="radio" name="reviewResult" value="REJECTED"> 반려</label>
          </div>
          <textarea id="reviewText" placeholder="종합 의견을 입력해 주세요."></textarea>
        </div>

        <div class="irb-submit-bar">
          <button type="button" class="auth-submit" id="btnSubmit" style="max-width:280px;">심사 제출하기</button>
        </div>
      </form>
    </div>

  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
  var testId = new URLSearchParams(window.location.search).get("id");
  var currentPath = window.location.pathname + window.location.search;

  if (!testId) {
    showError("잘못된 접근입니다. 이메일로 받으신 링크를 다시 확인해주세요.");
    return;
  }

  var me = null;
  var testInfo = null;
  var template = null;
  var existingAnswerId = null;

  const CATEGORY_LABEL = { DOCUMENTS: "서류심사", ETHICS: "윤리심사", SCIENTIFICS: "과학성심사", AGREEMENTS: "동의사항" };
  const STATUS_LABEL = { IN_REVIEW: "심사중", COMPLETED: "완료" };

  fetch("/api/auth/me")
    .then(function (res) {
      if (res.status === 401) {
        window.location.href = "/auth/login?redirect=" + encodeURIComponent(currentPath);
        return Promise.reject("redirecting");
      }
      return res.json();
    })
    .then(function (user) {
      me = user;
      return fetch("/api/irbs/" + testId);
    })
    .then(function (res) {
      if (!res.ok) return res.json().then(function (e) { throw new Error(e.message || "조회에 실패했습니다."); });
      return res.json();
    })
    .then(function (item) {
      testInfo = item;
      renderInfo(item);
      return fetch("/api/irb-templates/" + item.irbTestId + "?surveyName=BASIC");
    })
    .then(function (res) {
      if (!res.ok) throw new Error("아직 이 심사에 대한 심사지가 준비되지 않았습니다. 담당자에게 문의해 주세요.");
      return res.json();
    })
    .then(function (tpl) {
      template = tpl;
      return fetch("/api/irb-answers/" + testId + "?memberId=" + me.memberId);
    })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (existingAnswer) {
      renderQuestions(template, existingAnswer);
      if (existingAnswer) {
        existingAnswerId = existingAnswer.id;
      }
      return fetch("/api/irb-results/my/" + testId + "?memberId=" + me.memberId);
    })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (existingResult) {
      if (existingResult) {
        var radio = document.querySelector('input[name="reviewResult"][value="' + existingResult.reviewResult + '"]');
        if (radio) radio.checked = true;
        document.getElementById("reviewText").value = existingResult.reviewText || "";
      }
      document.getElementById("loadingBox").style.display = "none";
      document.getElementById("contentBox").style.display = "block";
    })
    .catch(function (err) {
      if (err !== "redirecting") showError(err.message || String(err));
    });

  function renderInfo(item) {
    document.getElementById("infoTitle").innerText = item.title;
    document.getElementById("infoCode").innerText = item.irbCode || "-";
    document.getElementById("infoPeriod").innerText = (item.startDate || "-") + " ~ " + (item.endDate || "-");
    document.getElementById("infoStatus").innerText = STATUS_LABEL[item.status] || item.status;
    if (item.attachedFileUrls && item.attachedFileUrls.length) {
      document.getElementById("infoFiles").innerHTML = "첨부파일: " + item.attachedFileUrls.map(function (u) {
        return '<a href="' + u + '" target="_blank">' + u.split('/').pop() + '</a>';
      }).join(", ");
    }
  }

  function renderQuestions(tpl, existingAnswer) {
    var answers = (existingAnswer && existingAnswer.answerList) || {};
    var byCategory = {};
    (tpl.questionList || []).forEach(function (q) {
      var cat = q.category || "ETC";
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(q);
    });

    var html = "";
    Object.keys(byCategory).forEach(function (cat) {
      html += '<div class="irb-section">';
      html += '<div class="irb-section-header">' + (CATEGORY_LABEL[cat] || cat) + '</div>';
      byCategory[cat].forEach(function (q) {
        html += '<div class="irb-q-row">';
        html += '<div class="irb-q-text">' + q.text + '</div>';
        html += '<div class="irb-q-answer">' + renderAnswerInput(q, answers[q.id]) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    document.getElementById("questionArea").innerHTML = html || '<p class="sub-desc">등록된 문항이 없습니다.</p>';
  }

  function renderAnswerInput(q, value) {
    var name = "q_" + q.id;
    if (q.type === "PREFERENCE") {
      var opts = [1, 2, 3, 4, 5];
      return opts.map(function (n) {
        var checked = Number(value) === n ? "checked" : "";
        return '<label><input type="radio" name="' + name + '" value="' + n + '" ' + checked + '> ' + n + '</label>';
      }).join("");
    }
    if (q.type === "TEXT") {
      return '<textarea name="' + name + '" data-qid="' + q.id + '">' + (value || "") + '</textarea>';
    }
    // BOOLEAN 기본값
    var yesChecked = value === true ? "checked" : "";
    var noChecked = value === false ? "checked" : "";
    return '<label><input type="radio" name="' + name + '" value="true" ' + yesChecked + '> 적합</label>' +
           '<label><input type="radio" name="' + name + '" value="false" ' + noChecked + '> 부적합</label>';
  }

  function collectAnswers() {
    var answerList = {};
    (template.questionList || []).forEach(function (q) {
      var name = "q_" + q.id;
      if (q.type === "TEXT") {
        var el = document.querySelector('textarea[name="' + name + '"]');
        answerList[q.id] = el ? el.value : "";
      } else {
        var checked = document.querySelector('input[name="' + name + '"]:checked');
        if (!checked) { answerList[q.id] = null; return; }
        answerList[q.id] = q.type === "PREFERENCE" ? Number(checked.value) : checked.value === "true";
      }
    });
    return answerList;
  }

  document.getElementById("btnSubmit").addEventListener("click", function () {
    var reviewResultEl = document.querySelector('input[name="reviewResult"]:checked');
    if (!reviewResultEl) { alert("종합 심사 결과(승인/반려)를 선택해 주세요."); return; }

    var answerList = collectAnswers();
    var unanswered = Object.values(answerList).some(function (v) { return v === null || v === ""; });
    if (unanswered) { alert("모든 문항에 답변해 주세요."); return; }

    var payload = {
      answer: {
        memberId: me.memberId,
        irbTestId: testInfo.irbTestId,
        surveyTemplateId: template.id,
        answerList: answerList
      },
      result: {
        memberId: me.memberId,
        irbTestId: testInfo.irbTestId,
        surveyTemplateId: template.id,
        reviewResult: reviewResultEl.value,
        reviewText: document.getElementById("reviewText").value
      }
    };

    var btn = this;
    btn.disabled = true;
    btn.innerText = "제출 중...";

    var isUpdate = !!existingAnswerId;
    var url = isUpdate ? ("/api/irb-surveys/" + testInfo.id + "?memberId=" + me.memberId) : "/api/irb-surveys";
    var method = isUpdate ? "PUT" : "POST";

    fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(isUpdate ? { answer: payload.answer, result: payload.result } : payload)
    })
      .then(function (res) {
        if (!res.ok) throw new Error("제출에 실패했습니다.");
        alert("심사 결과가 제출되었습니다. 감사합니다.");
        window.location.reload();
      })
      .catch(function (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerText = "심사 제출하기";
      });
  });

  function showError(message) {
    document.getElementById("loadingBox").style.display = "none";
    document.getElementById("errorMessage").innerText = message;
    document.getElementById("errorBox").style.display = "block";
  }
});
</script>

</body>
</html>
