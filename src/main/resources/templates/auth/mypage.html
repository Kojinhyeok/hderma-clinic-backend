<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내정보 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
<style>
.mp-wrap{max-width:860px; margin:0 auto; padding:0 24px;}
.mp-tabs{display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:28px;}
.mp-tabs button{padding:14px 22px; font-size:15px; font-weight:700; color:var(--gray); background:none; border:0; border-bottom:3px solid transparent; cursor:pointer;}
.mp-tabs button.active{color:var(--navy); border-bottom-color:var(--teal);}
.mp-panel{display:none;} .mp-panel.active{display:block;}
.mp-info{border-top:2px solid var(--navy);}
.mp-info div{display:flex; padding:16px 8px; border-bottom:1px solid var(--line); font-size:14.5px;}
.mp-info dt{width:130px; flex:none; font-weight:700; color:var(--navy);}
.mp-info dd{margin:0; color:var(--ink); word-break:break-all;}
.mp-note{margin-top:18px; font-size:12.5px; color:var(--gray);}
.mp-info dd input{width:100%; max-width:360px; height:42px; padding:0 14px; border:1px solid var(--line); border-radius:8px; font-size:14.5px; font-family:inherit;}
.mp-info dd input:focus{border-color:var(--teal); outline:none;}
.mp-info dd .mp-lock{font-size:12px; color:var(--gray-soft); margin-left:8px;}
.mp-actions{display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;}
.mp-btn.primary{background:var(--grad); border-color:transparent; color:#fff;}
.mp-pw{margin-top:40px; padding-top:28px; border-top:1px solid var(--line); display:none;}
.mp-pw.open{display:block;}
.mp-pw h3{font-size:16px; font-weight:800; color:var(--navy); margin:0 0 16px;}
.mp-pw .mp-field{margin-bottom:14px;}
.mp-pw label{display:block; font-size:13px; font-weight:700; color:var(--ink); margin-bottom:6px;}
.mp-pw input{width:100%; max-width:360px; height:42px; padding:0 14px; border:1px solid var(--line); border-radius:8px; font-size:14.5px; font-family:inherit;}
.mp-pw input:focus{border-color:var(--teal); outline:none;}
.mp-app{border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:14px; background:#fff;}
.mp-app-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px;}
.mp-app h4{font-size:16.5px; font-weight:800; color:var(--navy); margin:0 0 4px;}
.mp-app .code{font-size:12.5px; color:var(--gray);}
.mp-badge{flex:none; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:700; background:#eef2f6; color:#5b6b7b;}
.mp-badge.APPLIED{background:#e6f4ff; color:#1677c8;}
.mp-badge.SELECTED{background:#e3f7ec; color:#17874d;}
.mp-badge.REJECTED{background:#fdeaea; color:#c0392b;}
.mp-badge.CANCELLED{background:#eee; color:#888;}
.mp-app dl{display:grid; grid-template-columns:repeat(3,1fr); gap:10px 16px; margin:0;}
.mp-app dl div{font-size:13.5px;}
.mp-app dt{font-size:12px; color:var(--gray); margin-bottom:2px;}
.mp-app dd{margin:0; color:var(--ink); font-weight:600;}
.mp-app-btns{display:flex; gap:8px; margin-top:16px; justify-content:flex-end;}
.mp-btn{padding:8px 16px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);}
.mp-btn.danger{border-color:#e0455a; color:#e0455a;}
.mp-empty{text-align:center; padding:60px 0; color:var(--gray); font-size:14.5px;}
@media(max-width:700px){ .mp-app dl{grid-template-columns:1fr 1fr;} .mp-info dt{width:96px;} .mp-info dd input{max-width:100%;} .mp-tabs button{flex:1; padding:14px 8px;} }
</style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>내정보</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<section class="sub-content">
  <div class="mp-wrap">
    <div class="mp-tabs" id="mpTabs">
      <button type="button" class="active" data-tab="profile">내정보</button>
      <button type="button" data-tab="applications">신청내역</button>
    </div>

    <div class="mp-panel active" data-panel="profile">
      <dl class="mp-info" id="mpProfile"></dl>
      <div class="mp-actions" id="mpActions">
        <button type="button" class="mp-btn primary" id="btnEdit">정보 수정</button>
        <button type="button" class="mp-btn" id="btnPwToggle">비밀번호 변경</button>
      </div>
      <div class="mp-actions" id="mpEditActions" style="display:none;">
        <button type="button" class="mp-btn primary" id="btnSaveProfile">저장</button>
        <button type="button" class="mp-btn" id="btnCancelEdit">취소</button>
      </div>
      <p class="mp-note">아이디는 변경할 수 없습니다.</p>

      <div class="mp-pw" id="mpPw">
        <h3>비밀번호 변경</h3>
        <div class="mp-field"><label>현재 비밀번호</label><input type="password" id="pwCurrent" autocomplete="current-password"></div>
        <div class="mp-field"><label>새 비밀번호</label><input type="password" id="pwNew" placeholder="8자 이상" autocomplete="new-password"></div>
        <div class="mp-field"><label>새 비밀번호 확인</label><input type="password" id="pwNew2" autocomplete="new-password"></div>
        <div class="mp-actions">
          <button type="button" class="mp-btn primary" id="btnSavePw">비밀번호 변경</button>
        </div>
      </div>
    </div>

    <div class="mp-panel" data-panel="applications">
      <div id="mpApps"></div>
    </div>
  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var STATUS = { APPLIED: "접수완료", SELECTED: "선정", REJECTED: "미선정", CANCELLED: "취소" };
  var ROLE = { MEMBER: "일반회원", PROFESSOR: "교수", ADMIN: "관리자" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function d10(s) { return s ? String(s).substring(0, 10).replace(/-/g, ".") : "-"; }

  // 탭
  var tabs = document.querySelectorAll("#mpTabs button");
  function showTab(name) {
    tabs.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-tab") === name); });
    document.querySelectorAll(".mp-panel").forEach(function (p) { p.classList.toggle("active", p.getAttribute("data-panel") === name); });
  }
  tabs.forEach(function (b) { b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); }); });
  if (new URLSearchParams(location.search).get("tab") === "applications") showTab("applications");

  function goLogin() { location.href = "/auth/login?redirect=" + encodeURIComponent("/auth/mypage"); }

  // 내정보 (보기 / 수정)
  var profile = null;

  function renderView() {
    var m = profile;
    document.getElementById("mpProfile").innerHTML =
      '<div><dt>이름</dt><dd>' + esc(m.name) + '</dd></div>' +
      '<div><dt>아이디</dt><dd>' + esc(m.username) + '</dd></div>' +
      '<div><dt>이메일</dt><dd>' + esc(m.email || "-") + '</dd></div>' +
      '<div><dt>휴대전화</dt><dd>' + esc(m.phone || "-") + '</dd></div>' +
      '<div><dt>생년월일</dt><dd>' + d10(m.birthDate) + '</dd></div>' +
      '<div><dt>회원구분</dt><dd>' + esc(ROLE[m.role] || m.role) + '</dd></div>' +
      '<div><dt>가입일</dt><dd>' + d10(m.createdAt) + '</dd></div>';
    document.getElementById("mpActions").style.display = "flex";
    document.getElementById("mpEditActions").style.display = "none";
  }

  function renderEdit() {
    var m = profile;
    document.getElementById("mpProfile").innerHTML =
      '<div><dt>이름</dt><dd><input type="text" id="edName" value="' + esc(m.name) + '"></dd></div>' +
      '<div><dt>아이디</dt><dd>' + esc(m.username) + '<span class="mp-lock">변경 불가</span></dd></div>' +
      '<div><dt>이메일</dt><dd><input type="email" id="edEmail" value="' + esc(m.email || "") + '" placeholder="example@email.com (선택)"></dd></div>' +
      '<div><dt>휴대전화</dt><dd><input type="tel" id="edPhone" inputmode="numeric" maxlength="13" value="' + esc(m.phone || "") + '" placeholder="010-0000-0000"></dd></div>' +
      '<div><dt>생년월일</dt><dd><input type="date" id="edBirth" value="' + (m.birthDate ? String(m.birthDate).substring(0, 10) : "") + '"></dd></div>' +
      '<div><dt>회원구분</dt><dd>' + esc(ROLE[m.role] || m.role) + '</dd></div>' +
      '<div><dt>가입일</dt><dd>' + d10(m.createdAt) + '</dd></div>';
    document.getElementById("mpActions").style.display = "none";
    document.getElementById("mpEditActions").style.display = "flex";
    document.getElementById("edPhone").addEventListener("input", function () {
      var d = this.value.replace(/\D/g, "").slice(0, 11);
      if (d.length > 7) this.value = d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
      else if (d.length > 3) this.value = d.slice(0, 3) + "-" + d.slice(3);
      else this.value = d;
    });
  }

  function jsonFetch(url, method, body) {
    return fetch(url, {
      method: method, credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.status === 401) { goLogin(); throw new Error("login"); }
        if (!res.ok) throw new Error(data.message || "처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        return data;
      });
    });
  }

  fetch("/api/my/profile", { credentials: "same-origin" })
    .then(function (res) { if (res.status === 401) { goLogin(); throw new Error("login"); } return res.json(); })
    .then(function (m) { profile = m; renderView(); })
    .catch(function () {});

  document.getElementById("btnEdit").addEventListener("click", function () { if (profile) renderEdit(); });
  document.getElementById("btnCancelEdit").addEventListener("click", function () { renderView(); });

  document.getElementById("btnSaveProfile").addEventListener("click", function () {
    var name = document.getElementById("edName").value.trim();
    var email = document.getElementById("edEmail").value.trim();
    var phone = document.getElementById("edPhone").value.trim();
    var birth = document.getElementById("edBirth").value;
    if (!name) { alert("이름을 입력해주세요."); return; }
    if (phone.replace(/\D/g, "").length < 10) { alert("휴대전화번호를 정확히 입력해주세요."); return; }
    if (!birth) { alert("생년월일을 입력해주세요."); return; }

    var btn = this;
    btn.disabled = true;
    jsonFetch("/api/my/profile", "PATCH", { name: name, email: email, phone: phone, birthDate: birth })
      .then(function (m) { profile = m; renderView(); alert("회원 정보가 수정되었습니다."); })
      .catch(function (e) { if (e.message !== "login") alert(e.message); })
      .finally(function () { btn.disabled = false; });
  });

  // 비밀번호 변경
  document.getElementById("btnPwToggle").addEventListener("click", function () {
    document.getElementById("mpPw").classList.toggle("open");
  });
  document.getElementById("btnSavePw").addEventListener("click", function () {
    var cur = document.getElementById("pwCurrent").value;
    var n1 = document.getElementById("pwNew").value;
    var n2 = document.getElementById("pwNew2").value;
    if (!cur) { alert("현재 비밀번호를 입력해주세요."); return; }
    if (n1.length < 8) { alert("새 비밀번호는 8자 이상으로 입력해주세요."); return; }
    if (n1 !== n2) { alert("새 비밀번호가 일치하지 않습니다."); return; }

    var btn = this;
    btn.disabled = true;
    jsonFetch("/api/my/password", "PATCH", { currentPassword: cur, newPassword: n1 })
      .then(function () {
        alert("비밀번호가 변경되었습니다.");
        ["pwCurrent", "pwNew", "pwNew2"].forEach(function (id) { document.getElementById(id).value = ""; });
        document.getElementById("mpPw").classList.remove("open");
      })
      .catch(function (e) { if (e.message !== "login") alert(e.message); })
      .finally(function () { btn.disabled = false; });
  });

  // 신청내역
  function loadApps() {
    fetch("/api/my/applications", { credentials: "same-origin" })
      .then(function (res) { if (res.status === 401) { goLogin(); throw new Error("login"); } return res.json(); })
      .then(function (list) {
        var box = document.getElementById("mpApps");
        if (!list.length) {
          box.innerHTML = '<div class="mp-empty">신청하신 시험이 없습니다.<br><br><a class="mp-btn" href="/participate/apply">시험참여신청 바로가기</a></div>';
          return;
        }
        box.innerHTML = list.map(function (a) {
          return '<div class="mp-app">' +
            '<div class="mp-app-top"><div><h4>' + esc(a.trialName) + '</h4><span class="code">' + esc(a.trialCode || "") + '</span></div>' +
            '<span class="mp-badge ' + esc(a.status) + '">' + esc(STATUS[a.status] || a.status) + '</span></div>' +
            '<dl>' +
            '<div><dt>방문 희망일</dt><dd>' + d10(a.preferredDate) + '</dd></div>' +
            '<div><dt>방문 희망 시간</dt><dd>' + esc(a.preferredTimeSlot || "-") + '</dd></div>' +
            '<div><dt>신청일</dt><dd>' + d10(a.createdAt) + '</dd></div>' +
            '</dl>' +
            (a.inquiry ? '<p class="mp-note">문의사항: ' + esc(a.inquiry) + '</p>' : '') +
            '<div class="mp-app-btns">' +
            '<a class="mp-btn" href="/participate/detail?id=' + a.recruitmentId + '">시험 상세</a>' +
            (a.status === "APPLIED" ? '<button type="button" class="mp-btn danger" data-cancel="' + a.id + '">신청 취소</button>' : '') +
            '</div></div>';
        }).join("");
        box.querySelectorAll("[data-cancel]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            if (!confirm("이 시험 신청을 취소하시겠습니까?")) return;
            fetch("/api/my/applications/" + btn.getAttribute("data-cancel") + "/cancel", { method: "PATCH", credentials: "same-origin" })
              .then(function (res) { return res.json().then(function (b) { if (!res.ok) throw new Error(b.message || "취소에 실패했습니다."); return b; }); })
              .then(function () { loadApps(); })
              .catch(function (e) { alert(e.message); });
          });
        });
      })
      .catch(function () {});
  }
  loadApps();
});
</script>
</body>
</html>
