<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 찾기 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
<style>
.pw-step{display:none;}
.pw-step.active{display:block;}
.pw-done{text-align:center;}
.pw-done p{font-size:14.5px; line-height:1.7; color:var(--gray); margin-bottom:24px;}
.pw-done a{display:flex; align-items:center; justify-content:center; height:54px; border-radius:12px; background:var(--grad); color:#fff; font-size:15.5px; font-weight:700;}
</style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>비밀번호 찾기</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<section class="sub-content">
  <div class="auth-wrap">
    <div class="auth-card reveal-up">
      <div class="auth-logo">
        <img th:src="@{/assets/images/logo-icon.png}" alt="H-Derma">
      </div>
      <h2>비밀번호 찾기</h2>

      <!-- 1단계: 본인 확인 -->
      <div class="pw-step active" id="step1">
        <p class="sub-desc">가입 시 입력하신 아이디, 이름, 휴대전화번호를 입력해 주세요.</p>
        <form id="verifyForm" onsubmit="return false;">
          <div class="auth-field">
            <label>아이디<span class="req-mark">*</span></label>
            <input type="text" id="username" required placeholder="아이디를 입력해 주세요" autocomplete="username">
          </div>
          <div class="auth-field">
            <label>이름<span class="req-mark">*</span></label>
            <input type="text" id="name" required placeholder="이름을 입력해 주세요">
          </div>
          <div class="auth-field">
            <label>휴대전화번호<span class="req-mark">*</span></label>
            <input type="tel" id="phone" required inputmode="numeric" maxlength="13" placeholder="010-0000-0000">
          </div>
          <button type="button" class="auth-submit" id="btnVerify">본인 확인</button>
        </form>
      </div>

      <!-- 2단계: 새 비밀번호 설정 -->
      <div class="pw-step" id="step2">
        <p class="sub-desc">본인 확인이 완료되었습니다. 새 비밀번호를 입력해 주세요.</p>
        <form id="resetForm" onsubmit="return false;">
          <div class="auth-field">
            <label>새 비밀번호<span class="req-mark">*</span></label>
            <input type="password" id="newPassword" placeholder="8자 이상" autocomplete="new-password">
          </div>
          <div class="auth-field">
            <label>새 비밀번호 확인<span class="req-mark">*</span></label>
            <input type="password" id="newPasswordConfirm" placeholder="다시 입력" autocomplete="new-password">
          </div>
          <button type="button" class="auth-submit" id="btnReset">비밀번호 변경</button>
        </form>
      </div>

      <!-- 완료 -->
      <div class="pw-step pw-done" id="step3">
        <p class="sub-desc" style="margin-bottom:12px;">비밀번호가 변경되었습니다.</p>
        <p>새 비밀번호로 로그인해 주세요.</p>
        <a th:href="@{/auth/login}">로그인하러 가기</a>
      </div>

      <div class="auth-links">
        <a th:href="@{/auth/login}">로그인</a>
        <span>|</span>
        <a th:href="@{/auth/register}">회원가입</a>
        <span>|</span>
        <a th:href="@{/auth/find-id}">아이디 찾기</a>
      </div>
    </div>
  </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var phoneInput = document.getElementById("phone");

  phoneInput.addEventListener("input", function () {
    var d = this.value.replace(/\D/g, "").slice(0, 11);
    if (d.length > 7) this.value = d.slice(0, 3) + "-" + d.slice(3, 7) + "-" + d.slice(7);
    else if (d.length > 3) this.value = d.slice(0, 3) + "-" + d.slice(3);
    else this.value = d;
  });

  function showStep(n) {
    ["step1", "step2", "step3"].forEach(function (id, i) {
      document.getElementById(id).classList.toggle("active", i === n - 1);
    });
    document.querySelector(".auth-card h2").style.display = n === 3 ? "none" : "";
  }

  function post(url, body) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.message || "처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        return data;
      });
    });
  }

  function verify() {
    var username = document.getElementById("username").value.trim();
    var name = document.getElementById("name").value.trim();
    var phone = phoneInput.value.trim();
    if (!username) { alert("아이디를 입력해주세요."); return; }
    if (!name) { alert("이름을 입력해주세요."); return; }
    if (phone.replace(/\D/g, "").length < 10) { alert("휴대전화번호를 정확히 입력해주세요."); return; }

    var btn = document.getElementById("btnVerify");
    btn.disabled = true;
    btn.innerText = "확인 중...";
    post("/api/auth/password-reset/verify", { username: username, name: name, phone: phone })
      .then(function () {
        showStep(2);
        document.getElementById("newPassword").focus();
      })
      .catch(function (err) { alert(err.message); })
      .finally(function () {
        btn.disabled = false;
        btn.innerText = "본인 확인";
      });
  }

  function reset() {
    var pw = document.getElementById("newPassword").value;
    var pw2 = document.getElementById("newPasswordConfirm").value;
    if (pw.length < 8) { alert("비밀번호는 8자 이상으로 입력해주세요."); return; }
    if (pw !== pw2) { alert("비밀번호가 일치하지 않습니다."); return; }

    var btn = document.getElementById("btnReset");
    btn.disabled = true;
    btn.innerText = "변경 중...";
    post("/api/auth/password-reset/confirm", { newPassword: pw })
      .then(function () { showStep(3); })
      .catch(function (err) {
        alert(err.message);
        // 본인 확인이 만료된 경우 처음 단계로
        if (err.message.indexOf("만료") !== -1) showStep(1);
      })
      .finally(function () {
        btn.disabled = false;
        btn.innerText = "비밀번호 변경";
      });
  }

  document.getElementById("btnVerify").addEventListener("click", verify);
  document.getElementById("btnReset").addEventListener("click", reset);
  document.getElementById("verifyForm").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); verify(); }
  });
  document.getElementById("resetForm").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); reset(); }
  });
});
</script>

</body>
</html>
