<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시험참여신청 | H-Derma Global Clinical Center</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<link rel="stylesheet" th:href="@{/css/sub.css}">
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="sub-hero">
  <img class="sub-hero-bg" th:src="@{/assets/images/bg-network-white.svg}" alt="" aria-hidden="true">
  <div class="sub-hero-inner">
    <h1>시험참여신청</h1>
    <p>H-Derma Global Clinical Center</p>
  </div>
</section>

<div class="sub-nav-wrap">
  <nav class="sub-nav">
    <a th:href="@{/participate/guide}">시험참여안내</a>
    <a th:href="@{/participate/apply}" class="active">시험참여신청</a>
  </nav>
</div>

<section class="sub-content">
  <div class="ta-wrap">
    <div class="ta-tabs reveal-up" id="taTabs">
      <button type="button" data-cat="" class="active">전체</button>
      <button type="button" data-cat="EFFICACY">유효성 평가</button>
      <button type="button" data-cat="FUNCTIONAL">기능성 평가</button>
      <button type="button" data-cat="HEALTH_FOOD">건강기능식품 평가</button>
      <button type="button" data-cat="SAFETY">안전성 평가</button>
    </div>

    <div class="ta-list reveal-stagger" id="taList"></div>

    <div class="ta-empty" id="taEmpty" style="display:none;">
      <p>해당 분야의 모집 중인 시험이 없습니다.</p>
    </div>
  </div>
</section>

<!-- 상세 + 신청 모달 -->
<div id="taModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:3000; align-items:center; justify-content:center;">
  <div style="background:#fff; max-width:640px; width:92%; max-height:85vh; overflow-y:auto; border-radius:10px; padding:32px;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
      <h3 id="taModalTitle" style="margin:0;"></h3>
      <button type="button" id="taModalClose" style="border:none; background:none; font-size:1.4rem; cursor:pointer;">&times;</button>
    </div>
    <p style="color:#888; font-size:0.85rem; margin-bottom:20px;" id="taModalCode"></p>

    <dl class="ta-info-grid" id="taModalInfo" style="margin-bottom:20px;"></dl>

    <div id="taModalContent" style="white-space:pre-line; line-height:1.7; margin-bottom:24px;"></div>

    <div id="taApplyArea">
      <button type="button" id="btnOpenApplyForm" class="auth-submit" style="max-width:220px;">참여 신청하기</button>
    </div>

    <form id="taApplyForm" style="display:none; border-top:1px solid #e5e8ee; padding-top:20px; margin-top:10px;">
      <div class="auth-field">
        <label>이름<span class="req-mark">*</span></label>
        <input type="text" id="applicantName" required>
      </div>
      <div class="auth-field">
        <label>연락처<span class="req-mark">*</span></label>
        <input type="text" id="applicantContact" required placeholder="010-0000-0000">
      </div>
      <div class="auth-field">
        <label>생년월일<span class="req-mark">*</span></label>
        <input type="date" id="applicantBirth" required>
      </div>
      <button type="button" class="auth-submit" id="btnSubmitApply" style="margin-top:16px;">신청 완료</button>
    </form>
  </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script th:inline="javascript">
document.addEventListener("DOMContentLoaded", function () {
  var STATUS_LABEL = { OPEN: "모집중", CLOSED: "마감", PERMANENTLY_OPEN: "상시모집" };
  var STATUS_CLASS = { OPEN: "open", CLOSED: "closed", PERMANENTLY_OPEN: "permanent" };

  var recruitments = [];
  var currentCat = "";
  var currentRecruitment = null;

  function loadList() {
    var url = "/api/recruitments" + (currentCat ? "?evalCategory=" + currentCat : "");
    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (list) {
        recruitments = list;
        renderList();
      });
  }

  function fmtDate(d) { return d ? d.replace(/-/g, ".") : "-"; }

  function renderList() {
    var listEl = document.getElementById("taList");
    var emptyEl = document.getElementById("taEmpty");

    if (recruitments.length === 0) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    listEl.innerHTML = recruitments.map(function (r) {
      var period = (r.status === "PERMANENTLY_OPEN")
        ? "상시"
        : fmtDate(r.applicationStartDate) + " ~ " + fmtDate(r.applicationEndDate);
      return (
        '<a href="javascript:" class="ta-card" onclick="openDetail(' + r.id + ')">' +
        '<div class="ta-card-top">' +
        '<span class="ta-badge ' + (STATUS_CLASS[r.status] || '') + '">' + (STATUS_LABEL[r.status] || r.status) + '</span>' +
        '<span class="cat">' + (r.evalCategory || '') + ' · ' + (r.trialCode || '') + '</span>' +
        '</div>' +
        '<h4>' + r.trialName + '</h4>' +
        '<dl class="ta-info-grid">' +
        '<div><dt>시험기간</dt><dd>' + fmtDate(r.startDate) + ' ~ ' + fmtDate(r.endDate) + '</dd></div>' +
        '<div><dt>모집대상</dt><dd>' + (r.participationGroup || '-') + '</dd></div>' +
        '<div><dt>선정기준</dt><dd>' + (r.requirements || '-') + '</dd></div>' +
        '<div><dt>모집인원</dt><dd>' + (r.participationNumber != null ? r.participationNumber + '명' : '-') + '</dd></div>' +
        '<div><dt>시험참여비</dt><dd>' + (r.participationCost || '-') + '</dd></div>' +
        '</dl>' +
        '<div class="ta-apply-period">' +
        '<span class="period">신청기간 <b>' + period + '</b></span>' +
        '<span class="go">자세히 보기 →</span>' +
        '</div>' +
        '</a>'
      );
    }).join("");
  }

  document.querySelectorAll("#taTabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll("#taTabs button").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentCat = btn.dataset.cat;
      loadList();
    });
  });

  loadList();

  document.getElementById("taModalClose").addEventListener("click", closeModal);

  document.getElementById("btnOpenApplyForm").addEventListener("click", function () {
    document.getElementById("taApplyArea").style.display = "none";
    document.getElementById("taApplyForm").style.display = "block";
  });

  document.getElementById("btnSubmitApply").addEventListener("click", function () {
    var name = document.getElementById("applicantName").value.trim();
    var contact = document.getElementById("applicantContact").value.trim();
    var birth = document.getElementById("applicantBirth").value;

    if (!name) { alert("이름을 입력해주세요."); return; }
    if (!contact) { alert("연락처를 입력해주세요."); return; }
    if (!birth) { alert("생년월일을 입력해주세요."); return; }

    var btn = this;
    btn.disabled = true;
    btn.innerText = "처리 중...";

    fetch("/api/trial-applications", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        recruitmentId: currentRecruitment.id,
        applicantName: name,
        applicantContact: contact,
        applicantBirth: birth
      })
    })
      .then(function (res) {
        if (!res.ok) return res.json().then(function (e) { throw new Error(e.message || "신청 처리에 실패했습니다."); });
        alert("참여 신청이 완료되었습니다.");
        closeModal();
      })
      .catch(function (err) {
        alert(err.message);
        btn.disabled = false;
        btn.innerText = "신청 완료";
      });
  });

  window.openDetail = function (id) {
    fetch("/api/recruitments/" + id)
      .then(function (res) { return res.json(); })
      .then(function (r) {
        currentRecruitment = r;
        document.getElementById("taModalTitle").innerText = r.trialName;
        document.getElementById("taModalCode").innerText = (r.evalCategory || '') + ' · ' + (r.trialCode || '');
        document.getElementById("taModalInfo").innerHTML =
          '<div><dt>시험기간</dt><dd>' + fmtDate(r.startDate) + ' ~ ' + fmtDate(r.endDate) + '</dd></div>' +
          '<div><dt>모집대상</dt><dd>' + (r.participationGroup || '-') + '</dd></div>' +
          '<div><dt>선정기준</dt><dd>' + (r.requirements || '-') + '</dd></div>' +
          '<div><dt>모집인원</dt><dd>' + (r.participationNumber != null ? r.participationNumber + '명' : '-') + '</dd></div>' +
          '<div><dt>시험참여비</dt><dd>' + (r.participationCost || '-') + '</dd></div>';
        document.getElementById("taModalContent").innerText = r.detailContent || "";
        document.getElementById("taApplyArea").style.display = (r.status === "CLOSED") ? "none" : "block";
        document.getElementById("taApplyForm").style.display = "none";
        document.getElementById("taApplyForm").reset();
        document.getElementById("taModal").style.display = "flex";
      });
  };

  function closeModal() {
    document.getElementById("taModal").style.display = "none";
  }
});
</script>

</body>
</html>
